[server]
enableCORS = true
enableXsrfProtection = true
headless = true

[client]
showErrorDetails = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0071f2"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fa"
textColor = "#212529"
linkColor = "#0f1048"
borderColor = "#e0e0e0"
baseRadius = "12px"
buttonRadius = "25px"
baseFontSize = 16
baseFontWeight = 400
